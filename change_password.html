<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Change Password</title>
</head>
<body>
    <main class="form-card">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="logo">
        <h1>Change Password</h1>
        <p>Use a unique password with at least 12 characters.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="{{ category }}" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('change_password') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="current_password">Current password:</label>
            <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
            <label for="new_password">New password:</label>
            <input type="password" id="new_password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <label for="confirm_password">Confirm new password:</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <input type="submit" value="Change Password">
        </form>
        <p><a href="{{ url_for('profile') }}">Back to profile</a></p>
    </main>
</body>
</html>
